<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>VeloceDown — Video & Audio Downloader</title>
  <style>
    *{box-sizing:border-box}
    body{margin:0;background:#070d1d;color:#f5f7ff;font-family:Arial,sans-serif}
    header{padding:20px 7%;border-bottom:1px solid #1b2740}
    .logo{font-size:28px;font-weight:800}.logo span{color:#31d6c6}
    main{max-width:1000px;margin:auto;padding:35px 20px}
    .card{background:#101a30;border:1px solid #263553;border-radius:22px;padding:30px;margin-bottom:22px}
    h1,h2{margin-top:0}.muted{color:#aebbd4}
    .picker{border:2px dashed #405170;border-radius:20px;padding:35px;text-align:center;cursor:pointer}
    .picker:hover{border-color:#31d6c6}
    input[type=file]{display:none}
    button{border:0;border-radius:12px;padding:14px 24px;font-size:16px;font-weight:700;cursor:pointer;background:#31d6c6;color:#041018}
    button:disabled{opacity:.5;cursor:not-allowed}
    .filename{margin:18px 0;color:#c8d4e9;word-break:break-word}
    video{width:100%;max-height:420px;border-radius:14px;background:#000;margin-top:15px}
    .hidden{display:none}
    .progress-wrap{margin:20px 0}.progress-bar{height:18px;background:#202c45;border-radius:20px;overflow:hidden}
    .progress{height:100%;width:0%;background:#31d6c6;transition:width .15s}
    .status{text-align:center;margin-top:10px;color:#c8d4e9}
    .result{margin-top:20px;padding:20px;border:1px solid #31415f;border-radius:16px;text-align:center}
    a.download{display:inline-block;text-decoration:none;background:#31d6c6;color:#041018;padding:14px 24px;border-radius:12px;font-weight:700}
    .ad{border:1px dashed #405170;padding:20px;text-align:center;color:#687a9d;margin:20px 0}
  </style>
</head>
<body>
<header><div class="logo">Veloce<span>Down</span></div></header>

<main>
  <section class="card">
    <h1>Extract audio from your video</h1>
    <p class="muted">Choose a video stored on your phone or computer. VeloceDown extracts the audio and prepares an MP3.</p>

    <label class="picker" for="videoInput">
      <div style="font-size:42px">♪</div>
      <strong>Choose video from this device</strong>
      <div class="muted" id="selection">No video selected</div>
    </label>
    <input id="videoInput" type="file" accept="video/*,.mkv,.webm,.mp4,.mov,.avi,.m4v">

    <div id="previewBox" class="hidden">
      <video id="videoPreview" controls playsinline></video>
    </div>

    <div class="ad">ADVERTISEMENT — shown between actions, never during processing</div>

    <div class="progress-wrap hidden" id="progressWrap">
      <div class="progress-bar"><div class="progress" id="progress"></div></div>
      <div class="status" id="status">Preparing…</div>
    </div>

    <div style="text-align:center;margin-top:20px">
      <button id="extractBtn" disabled>Extract MP3</button>
    </div>

    <div id="result" class="result hidden">
      <h3>Your MP3 is ready.</h3>
      <a id="downloadLink" class="download" href="#">Download MP3</a>
    </div>
  </section>
</main>

<script>
const input = document.getElementById('videoInput');
const selection = document.getElementById('selection');
const previewBox = document.getElementById('previewBox');
const preview = document.getElementById('videoPreview');
const extractBtn = document.getElementById('extractBtn');
const progressWrap = document.getElementById('progressWrap');
const progress = document.getElementById('progress');
const status = document.getElementById('status');
const result = document.getElementById('result');
const downloadLink = document.getElementById('downloadLink');

let selectedFile = null;
let previewUrl = null;

input.addEventListener('change', () => {
  selectedFile = input.files[0];
  result.classList.add('hidden');
  if (!selectedFile) {
    selection.textContent = 'No video selected';
    extractBtn.disabled = true;
    previewBox.classList.add('hidden');
    return;
  }

  const mb = (selectedFile.size / 1024 / 1024).toFixed(1);
  selection.textContent = `${selectedFile.name} (${mb} MB)`;
  extractBtn.disabled = false;

  if (previewUrl) URL.revokeObjectURL(previewUrl);
  previewUrl = URL.createObjectURL(selectedFile);
  preview.src = previewUrl;
  previewBox.classList.remove('hidden');
});

extractBtn.addEventListener('click', () => {
  if (!selectedFile) return;

  extractBtn.disabled = true;
  result.classList.add('hidden');
  progressWrap.classList.remove('hidden');
  progress.style.width = '0%';
  status.textContent = 'Uploading… 0%';

  const xhr = new XMLHttpRequest();
  xhr.open('POST', '/api/extract-mp3');

  xhr.upload.onprogress = (e) => {
    if (e.lengthComputable) {
      const pct = Math.round((e.loaded / e.total) * 100);
      progress.style.width = pct + '%';
      status.textContent = `Uploading… ${pct}%`;
    }
  };

  xhr.onload = () => {
    if (xhr.status >= 200 && xhr.status < 300) {
      try {
        const data = JSON.parse(xhr.responseText);
        progress.style.width = '100%';
        status.textContent = 'Conversion complete — MP3 ready.';
        downloadLink.href = data.url;
        downloadLink.download = data.filename;
        result.classList.remove('hidden');
      } catch {
        status.textContent = 'The server returned an invalid response.';
      }
    } else {
      let msg = 'Conversion failed.';
      try { msg = JSON.parse(xhr.responseText).error || msg; } catch {}
      status.textContent = msg;
    }
    extractBtn.disabled = false;
  };

  xhr.onerror = () => {
    status.textContent = 'Network error. Please try again.';
    extractBtn.disabled = false;
  };

  const form = new FormData();
  form.append('video', selectedFile);
  status.textContent = 'Uploading…';
  xhr.send(form);
});
</script>
</body>
</html>
